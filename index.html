
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web GIS Batas Desa Flores Timur</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            background-color: #164b70;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 7px 0 0;
            font-size: 13px;
        }

        /* Peta */
        #map {
            width: 100%;
            height: 85vh;
        }

        /* Footer */
        .footer {
            background-color: #164b70;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <div class="header">

        <h2>WEB GIS BATAS DESA FLORES TIMUR</h2>

        <p>
            Visualisasi Data Spasial Menggunakan GeoServer dan LeafletJS
        </p>

    </div>


    <!-- ============================= -->
    <!-- CONTAINER PETA -->
    <!-- ============================= -->

    <div id="map"></div>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <div class="footer">

        Web GIS | GeoServer + LeafletJS

    </div>


    <!-- ============================= -->
    <!-- LEAFLET JAVASCRIPT -->
    <!-- ============================= -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // =========================================
        // 1. INISIALISASI PETA
        // =========================================

        var map = L.map('map').setView(
            [-8.3, 122.8], 9
        );


        // =========================================
        // 2. BASEMAP OPENSTREETMAP
        // =========================================

        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,

                attribution:
                '&copy; OpenStreetMap contributors'

            }
        ).addTo(map);


        // =========================================
        // 3. KONEKSI GEOSERVER
        // =========================================

        var geoserverURL =
        'http://localhost:8080/geoserver/pgweb11/wms';


        // =========================================
        // 4. MEMANGGIL LAYER BATAS DESA
        // =========================================

        var batasDesa = L.tileLayer.wms(
            geoserverURL,
            {
                layers: 'pgweb11:batas_desa',

                format: 'image/png',

                transparent: true,

                version: '1.1.1'

            }
        ).addTo(map);


        // =========================================
        // 5. MENAMPILKAN LEGENDA PETA
        // =========================================

        var legend = L.control({
            position: 'bottomleft'
        });

        legend.onAdd = function (map) {

            var div = L.DomUtil.create('div', 'info legend');

            div.style.background = 'white';
            div.style.padding = '8px';
            div.style.border = '1px solid #999';
            div.style.borderRadius = '5px';
            div.style.maxWidth = '200px';

            var legendURL =
            'http://localhost:8080/geoserver/pgweb11/wms?' +
            'REQUEST=GetLegendGraphic' +
            '&VERSION=1.0.0' +
            '&FORMAT=image/png' +
            '&LAYER=pgweb11:batas_desa';

            div.innerHTML =
                '<b>Legenda Batas Desa</b><br>' +
                '<img src="' + legendURL +
                '" style="max-width:180px;">';

            return div;

        };

        legend.addTo(map);


        // =========================================
        // 6. KONTROL BASEMAP DAN OVERLAY
        // =========================================

        var baseMaps = {

            "OpenStreetMap": osm

        };

        var overlayMaps = {

            "Batas Desa Flores Timur": batasDesa

        };

        L.control.layers(
            baseMaps,
            overlayMaps,
            {
                collapsed: false
            }
        ).addTo(map);


        // =========================================
        // 7. MENAMPILKAN SKALA PETA
        // =========================================

        L.control.scale({

            position: 'bottomright',

            metric: true,

            imperial: false

        }).addTo(map);


    </script>

</body>

</html>
